<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Payment Confirmation</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/success.js"></script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img src="/logo.png" alt="" width="34" height="35"><span>Sales Course Enrollment</span></a>
  </div>
</header>

<main class="wrap narrow">
  <section class="card result" aria-live="polite">
    <div id="result-icon" class="result-icon" aria-hidden="true"></div>
    <h1 id="result-title">Checking your payment…</h1>
    <p id="result-text" class="lede">This only takes a moment.</p>

    <div id="receipt" hidden>
      <span id="test-badge" class="badge" hidden>Test mode — no real money was charged</span>
      <h2>Enrolled candidates</h2>
      <ol id="receipt-list" class="receipt-list"></ol>
      <dl class="summary-rows">
        <div><dt>Receipt sent to</dt><dd id="receipt-email">—</dd></div>
        <div class="summary-total"><dt>Total paid</dt><dd id="receipt-total"></dd></div>
      </dl>
    </div>

    <div class="actions">
      <a class="btn-primary" href="/">Enroll more candidates</a>
    </div>
  </section>
</main>
</body>
</html>
